<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: sin esto, env(safe-area-inset-bottom) (la barra de navegación inferior, ver
         .bottom-tabs en index.css) siempre vale 0 — la app nunca sabe cuánto respetar del gesto/home del
         teléfono. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Instalable como app (Safari/Chrome → Añadir a pantalla de inicio), mismo patrón que mobile/web/index.html
         para la app de residentes — sin service worker: F1 de ese mismo proyecto ya encontró que un service
         worker deja a los usuarios viendo una versión vieja hasta su siguiente visita (ver build-app-web.sh,
         --pwa-strategy=none). Cache-Control: no-cache ya lo pone Caddy (Caddyfile) para este mismo motivo. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Panel Vivecom" />
    <link rel="apple-touch-icon" href="/icons/Icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Vivecom — Panel Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
