<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documento de alcance — Vivecom</title>
<link rel="stylesheet" href="estilos.css">
<style>
  #contenido h1 { font-size: 24px; margin-top: 0; }
  #contenido h2 { font-size: 19px; }
  #contenido h3 { font-size: 15.5px; }
  #contenido table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; }
  #contenido th, #contenido td { border: 1px solid var(--linea); padding: 6px 10px; text-align: left; }
  #contenido th { background: var(--papel-2); }
  #contenido blockquote { border-left: 3px solid var(--linea-fuerte); margin: 10px 0; padding: 4px 14px; color: var(--tinta-suave); }
</style>
</head>
<body>
<div class="envoltura">
  <a class="volver no-imprimir" href="index.html">&larr; Portal de documentación</a>
  <header class="top">
    <div>
      <div class="titulo">Documento de alcance</div>
      <div class="subtitulo">Qué incluye Vivecom, historias de usuario y decisiones de producto</div>
    </div>
    <button class="boton-imprimir no-imprimir" onclick="window.print()">Imprimir / guardar PDF</button>
  </header>
  <div id="contenido">Cargando…</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  fetch('alcance.md').then(r => r.text()).then(md => {
    document.getElementById('contenido').innerHTML = marked.parse(md);
  }).catch(() => {
    document.getElementById('contenido').textContent = 'No se pudo cargar el documento.';
  });
</script>
</body>
</html>
